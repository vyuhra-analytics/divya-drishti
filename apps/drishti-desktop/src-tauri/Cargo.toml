[package]
name = "drishti-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" turns on child webviews: the in-app browser panel is a second webview laid over the panel's rectangle
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
